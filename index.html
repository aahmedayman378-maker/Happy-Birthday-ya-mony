<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>A Gift For You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Caveat:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section id="rain-screen">
    <canvas id="rain-canvas"></canvas>
    <div id="rain-overlay">
      <div id="rain-words"></div>
      <button id="rain-cta">tap to open</button>
    </div>
  </section>

  <audio id="bg-audio" src="music.mp3" loop preload="auto"></audio>

  <div id="vinyl-player">
    <div class="vinyl-hint" id="vinyl-hint">tap to mute / unmute 🎵</div>
    <div class="vinyl-arm"></div>
    <div class="vinyl-disc">
      <div class="vinyl-disc__label">
        <img src="ph1.jpeg" alt="">
      </div>
    </div>
  </div>

  <div id="story">
    <section class="hero">
      <canvas class="star-canvas"></canvas>
      <div class="hero__content">
        <h1 class="hero__title" id="hero-title"></h1>
        <p class="hero__subtitle" id="hero-subtitle"></p>
        <div class="hero__cake">
          <svg viewBox="0 0 220 170" aria-hidden="true">
            <ellipse cx="110" cy="150" rx="95" ry="12" fill="rgba(255,93,122,0.12)" />
            <rect x="35" y="100" width="150" height="45" rx="8" fill="#3a2740" />
            <rect x="35" y="100" width="150" height="10" rx="4" fill="#4d3454" />
            <rect x="50" y="65" width="120" height="40" rx="8" fill="#4d3454" />
            <rect x="50" y="65" width="120" height="9" rx="4" fill="#623f6c" />
            <circle cx="60" cy="100" r="3.2" fill="#ffcf7a" />
            <circle cx="80" cy="100" r="3.2" fill="#ffcf7a" />
            <circle cx="100" cy="100" r="3.2" fill="#ffcf7a" />
            <circle cx="120" cy="100" r="3.2" fill="#ffcf7a" />
            <circle cx="140" cy="100" r="3.2" fill="#ffcf7a" />
            <circle cx="160" cy="100" r="3.2" fill="#ffcf7a" />
            <circle cx="45" cy="145" r="3.2" fill="#ff5d7a" />
            <circle cx="63" cy="145" r="3.2" fill="#ff5d7a" />
            <circle cx="81" cy="145" r="3.2" fill="#ff5d7a" />
            <circle cx="99" cy="145" r="3.2" fill="#ff5d7a" />
            <circle cx="117" cy="145" r="3.2" fill="#ff5d7a" />
            <circle cx="135" cy="145" r="3.2" fill="#ff5d7a" />
            <circle cx="153" cy="145" r="3.2" fill="#ff5d7a" />
            <circle cx="171" cy="145" r="3.2" fill="#ff5d7a" />
          </svg>
          <div class="hero__candles">
            <div class="hero__candle" style="animation-delay:0s"><span class="hero__flame"></span><span
                class="hero__stick"></span></div>
            <div class="hero__candle" style="animation-delay:.18s"><span class="hero__flame"></span><span
                class="hero__stick"></span></div>
            <div class="hero__candle" style="animation-delay:.36s"><span class="hero__flame"></span><span
                class="hero__stick"></span></div>
            <div class="hero__candle" style="animation-delay:.54s"><span class="hero__flame"></span><span
                class="hero__stick"></span></div>
            <div class="hero__candle" style="animation-delay:.72s"><span class="hero__flame"></span><span
                class="hero__stick"></span></div>
          </div>
        </div>
      </div>
      <div class="hero__scrolldown">scroll down ↓</div>
    </section>

    <section class="moments">
      <canvas class="star-canvas"></canvas>
      <div class="moments__inner" id="moments-inner"></div>
    </section>

    <section class="collage">
      <canvas class="star-canvas"></canvas>
      <div class="collage__inner">
        <p class="collage__message" id="collage-message"></p>
        <div class="collage__heart" id="collage-heart">
          <svg class="collage__heart-outline" viewBox="0 0 100 100" aria-hidden="true">
            <path
              d="M50,90 C22,68 6,44 6,26 C6,10 19,1 34,1 C43,1 48,7 50,15 C52,7 57,1 66,1 C81,1 94,10 94,26 C94,44 78,68 50,90 Z" />
          </svg>
        </div>
        <p class="collage__closing" id="collage-closing"></p>
      </div>
    </section>
  </div>

  <!-- content.js has all the text/photos you'd want to edit. script.js has the animation logic. -->
  <script src="content.js"></script>
  <script src="script.js"></script>
</body>

</html>
